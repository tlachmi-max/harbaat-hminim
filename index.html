<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>אישור איסוף ארבעת המינים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --palm-green: #2d4a22;
      --palm-dark: #1e3317;
      --gold: #d4af37;
      --gold-hover: #b89628;
      --sand-bg: #f8f6f0;
      --card-bg: #ffffff;
      --text-main: #2b2b2b;
      --text-muted: #666666;
      --error-red: #d9534f;
      --success-green: #28a745;
    }

    * { box-sizing: border-box; font-family: 'Rubik', sans-serif; }

    body {
      background-color: #f3f0e6;
      background-image: radial-gradient(var(--palm-green) 0.5px, transparent 0.5px);
      background-size: 24px 24px;
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 32px 24px;
      text-align: center;
      border: 1px solid rgba(45, 74, 34, 0.1);
    }

    .header-icon { font-size: 42px; margin-bottom: 12px; }
    h1 { color: var(--palm-green); font-size: 24px; margin: 0 0 8px 0; font-weight: 700; }
    p.subtitle { color: var(--text-muted); font-size: 14px; margin: 0 0 24px 0; line-height: 1.5; }

    .form-group { margin-bottom: 20px; text-align: right; }
    label { display: block; font-size: 14px; font-weight: 600; color: var(--palm-dark); margin-bottom: 8px; }

    input[type="tel"] {
      width: 100%; padding: 14px; font-size: 18px;
      border: 2px solid #e0e0e0; border-radius: 12px;
      text-align: center; direction: ltr; letter-spacing: 2px; outline: none;
    }

    input[type="tel"]:focus { border-color: var(--palm-green); }

    button {
      width: 100%; background-color: var(--gold); color: #ffffff;
      border: none; padding: 14px; font-size: 16px; font-weight: 700;
      border-radius: 12px; cursor: pointer; box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    button.secondary { background-color: transparent; color: var(--text-muted); box-shadow: none; border: 1px solid #ddd; }

    .order-summary {
      background: #fdfbf7; border: 1px solid #e8e2d5;
      border-radius: 12px; padding: 16px; margin: 16px 0 20px 0; text-align: right;
    }

    .order-summary ul { margin: 0; padding-right: 18px; font-size: 14px; }
    .msg { margin-top: 16px; font-size: 14px; min-height: 20px; }
    .msg.error { color: var(--error-red); }
    .msg.success { color: var(--success-green); font-weight: 600; }

    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,.3); border-radius: 50%;
      border-top-color: #fff; animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-icon">🌿</div>
    <h1>אישור איסוף ארבעת המינים</h1>
    <p class="subtitle">אנא הזינו את מספר הטלפון שאיתו ביצעתם את ההזמנה כדי לאשר את האיסוף</p>

    <!-- שלב 1: חיפוש -->
    <div id="stepPhone">
      <div class="form-group">
        <label for="phone">מספר טלפון</label>
        <input type="tel" id="phone" placeholder="0500000000" autocomplete="tel" />
      </div>
      <button id="findBtn" type="button">מצא את ההזמנה שלי</button>
      <p class="msg" id="phoneMsg"></p>
    </div>

    <!-- שלב 2: אישור -->
    <div id="stepConfirm" hidden>
      <p class="greeting">שלום, <strong id="foundName"></strong>!</p>
      
      <div class="order-summary">
        <h4 style="margin:0 0 10px 0; color:var(--palm-green);">פרטי ההזמנה שלך:</h4>
        <ul id="orderDetails"></ul>
      </div>

      <button id="confirmBtn" type="button">כן, אספתי את ארבעת המינים</button>
      <button class="secondary" id="backBtn" type="button" style="margin-top: 10px;">זה לא אני / חזרה</button>
      <p class="msg" id="confirmMsg"></p>
    </div>

    <!-- שלב 3: סיום -->
    <div id="stepDone" hidden>
      <div style="font-size: 50px; margin-bottom: 10px;">✅</div>
      <h2 style="color: var(--palm-green); margin-bottom: 8px;">תודה רבה!</h2>
      <p style="color: var(--text-muted); font-size: 15px;" id="doneText">האיסוף אושר בהצלחה במערכת. חג שמח!</p>
    </div>
  </div>

  <script>
    const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyuNvFPdf7RNwkdvzZLrMwS_0WrERvhh95DPIWAT0d2MDNzkRNHcbCznLk5xXEBn6EX/exec';

    const phoneInput = document.getElementById('phone');
    const findBtn = document.getElementById('findBtn');
    const phoneMsg = document.getElementById('phoneMsg');

    const stepPhone = document.getElementById('stepPhone');
    const stepConfirm = document.getElementById('stepConfirm');
    const stepDone = document.getElementById('stepDone');

    const foundName = document.getElementById('foundName');
    const orderDetails = document.getElementById('orderDetails');
    const confirmBtn = document.getElementById('confirmBtn');
    const confirmMsg = document.getElementById('confirmMsg');
    const backBtn = document.getElementById('backBtn');

    let currentPhone = '';

    findBtn.addEventListener('click', async () => {
      const phone = phoneInput.value.trim();
      if (!phone) {
        showMsg(phoneMsg, 'נא להזין מספר טלפון.', true);
        return;
      }

      setLoading(findBtn, true, 'מחפש...');
      showMsg(phoneMsg, '');

      try {
        const response = await fetch(`${WEBAPP_URL}?action=search&phone=${encodeURIComponent(phone)}`);
        const data = await response.json();

        setLoading(findBtn, false, 'מצא את ההזמנה שלי');

        if (!data.ok) {
          showMsg(phoneMsg, data.error || 'אירעה שגיאה בחיבור.', true);
          return;
        }

        if (!data.found) {
          showMsg(phoneMsg, 'לא נמצאה הזמנה עבור מספר הטלפון הזה.', true);
          return;
        }

        currentPhone = phone;
        foundName.textContent = data.name;

        orderDetails.innerHTML = '';
        if (data.orderDetails && data.orderDetails.length > 0) {
          data.orderDetails.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<strong>${item.label}:</strong> ${item.value}`;
            orderDetails.appendChild(li);
          });
        } else {
          orderDetails.innerHTML = '<li>לא צוינו פריטים ספציפיים.</li>';
        }

        if (data.alreadyConfirmed) {
          stepPhone.hidden = true;
          stepDone.hidden = false;
          document.getElementById('doneText').textContent = `${data.name}, כבר אישרת את איסוף ארבעת המינים בעבר. חג שמח!`;
          return;
        }

        stepPhone.hidden = true;
        stepConfirm.hidden = false;

      } catch (err) {
        setLoading(findBtn, false, 'מצא את ההזמנה שלי');
        showMsg(phoneMsg, 'שגיאת תקשורת. נא לנסות שוב.', true);
      }
    });

    confirmBtn.addEventListener('click', async () => {
      setLoading(confirmBtn, true, 'מעדכן...');
      showMsg(confirmMsg, '');

      try {
        const response = await fetch(`${WEBAPP_URL}?action=confirm&phone=${encodeURIComponent(currentPhone)}`);
        const data = await response.json();

        setLoading(confirmBtn, false, 'כן, אספתי את ארבעת המינים');

        if (data.ok && data.confirmed) {
          stepConfirm.hidden = true;
          stepDone.hidden = false;
          document.getElementById('doneText').textContent = `${data.name}, אישור האיסוף נרשם בהצלחה! חג שמח!`;
        } else {
          showMsg(confirmMsg, data.error || 'לא ניתן היה לאשר את האיסוף.', true);
        }
      } catch (err) {
        setLoading(confirmBtn, false, 'כן, אספתי את ארבעת המינים');
        showMsg(confirmMsg, 'שגיאת תקשורת. נא לנסות שוב.', true);
      }
    });

    backBtn.addEventListener('click', () => {
      stepConfirm.hidden = true;
      stepPhone.hidden = false;
      showMsg(phoneMsg, '');
    });

    function showMsg(el, text, isError = false) {
      el.textContent = text;
      el.className = 'msg ' + (isError ? 'error' : 'success');
    }

    function setLoading(btn, isLoading, originalText) {
      if (isLoading) {
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span>`;
      } else {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
  </script>
</body>
</html>
